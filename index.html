<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홍길동 - 프로필 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #5b21b6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .profile-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 24px;
      padding: 40px 28px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(30, 10, 60, 0.28);
    }

    .avatar-placeholder {
      width: 124px;
      height: 124px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background-color: #e2e5ea;
      border: 4px solid #f3f4f6;
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .profile-name:hover {
      color: #7c3aed;
    }

    .profile-bio {
      font-size: 0.98rem;
      line-height: 1.5;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .favorites {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 24px;
    }

    .favorites li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background-color: #f9fafb;
      border-radius: 14px;
      font-size: 0.96rem;
      color: #374151;
    }

    .emoji {
      font-size: 1.25rem;
      line-height: 1;
    }

    .sns-links {
      display: flex;
      gap: 10px;
    }

    .sns-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      background-color: #f3f4f6;
      color: #374151;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
    }

    .sns-btn:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .sns-btn.instagram:hover {
      background-color: #e1306c;
    }

    .sns-btn.github:hover {
      background-color: #1f2937;
    }

    .sns-btn.youtube:hover {
      background-color: #ff0000;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar-placeholder" aria-label="프로필 이미지 영역"></div>
    <h1 class="profile-name">박영후</h1>
    <p class="profile-bio">호기심 많고 차분한 기록을 즐기는 사람입니다.</p>
    <ul class="favorites">
      <li><span class="emoji">☕</span><span>따뜻한 아메리카노</span></li>
      <li><span class="emoji">📚</span><span>조용한 서점 산책</span></li>
      <li><span class="emoji">🎧</span><span>밤에 듣는 재즈 음악</span></li>
    </ul>
    <div class="sns-links" aria-label="SNS 링크">
      <a class="sns-btn instagram" href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="sns-btn github" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="sns-btn youtube" href="https://youtube.com" target="_blank" rel="noopener noreferrer">YouTube</a>
    </div>
  </main>
</body>
</html>
